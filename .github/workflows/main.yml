name: Build and Release AppSync

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AppSync version"
        required: true
        default: "116.0h"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Debian Package
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/../theos
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            make \
            git \
            curl \
            wget \
            perl \
            python3 \
            python3-pip \
            dpkg-dev \
            ldid \
            fakeroot \
            unzip

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          # Install Theos toolchain
          "$THEOS/bin/bootstrap.sh"

      - name: Install iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Verify Theos installation
        run: |
          echo "THEOS=$THEOS"

          echo "Checking clang:"
          ls -lah "$THEOS/toolchain/linux/iphone/bin/" || true

          echo "Checking SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" -print

          echo "Checking clang executable:"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "Checking SDK directory:"
          test -d "$THEOS/sdks"

          SDK_COUNT=$(find "$THEOS/sdks" -maxdepth 1 -type d -name "*.sdk" | wc -l)

          if [ "$SDK_COUNT" -eq 0 ]; then
            echo "::error::No iOS SDKs were installed."
            exit 1
          fi

          echo "Found $SDK_COUNT iOS SDK(s)."

      - name: Build AppSync
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          echo "Generated packages:"
          ls -lah debs/

      - name: Verify Debian packages
        run: |
          shopt -s nullglob
          packages=(debs/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .deb packages were generated."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Checking: $package"
            dpkg-deb --info "$package"
          done

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppSync-${{ env.VERSION }}
          path: debs/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "AppSync Unified ${VERSION}" \
            --generate-notes \
            debs/*.deb
