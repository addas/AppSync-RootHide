name: Build and Release AppSync

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AppSync version"
        required: true
        default: "116.0h"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Debian Package
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/../theos
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            wget \
            git \
            perl \
            python3 \
            dpkg-dev \
            unzip \
            xz-utils

      - name: Install RootHide Theos
        run: |
          rm -rf "$THEOS"

          mkdir -p "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o install-theos.sh

          chmod +x install-theos.sh

          THEOS="$THEOS" bash install-theos.sh

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          rm -f /tmp/iPhoneOS16.5.sdk.tar.xz

      - name: Verify RootHide Theos
        run: |
          echo "THEOS=$THEOS"

          echo
          echo "=== RootHide Theos ==="
          git -C "$THEOS" remote -v || true

          echo
          echo "=== clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo
          echo "=== SDKs ==="
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -printf "%f\n" | sort -V

          echo
          echo "=== RootHide header ==="
          find "$THEOS" \
            -name "roothide.h" \
            -print

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          if ! find "$THEOS" -name "roothide.h" -print -quit | grep -q .; then
            echo "::error::roothide.h was not found in RootHide Theos."
            exit 1
          fi

      - name: Build AppSync
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          echo "Generated packages:"
          find . -maxdepth 2 -name "*.deb" -print

      - name: Verify Debian packages
        run: |
          shopt -s nullglob

          packages=(debs/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .deb packages were generated."
            echo "Searching entire workspace:"
            find . -name "*.deb" -print
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Checking: $package"
            dpkg-deb --info "$package"
          done

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppSync-${{ env.VERSION }}
          path: debs/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "AppSync Unified ${VERSION}" \
            --generate-notes \
            debs/*.deb
