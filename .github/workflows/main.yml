name: Build and Release AppSync

on:
  workflow_dispatch:
    inputs:
      version:
        description: "AppSync version"
        required: true
        default: "116.0h"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Debian Package
    runs-on: ubuntu-22.04

    env:
      THEOS: ${{ github.workspace }}/../theos
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            git \
            libxml2 \
            dpkg-dev

      - name: Install Theos
        run: |
          rm -rf "$THEOS"

          mkdir -p "$(dirname "$THEOS")"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

      - name: Install Theos toolchain and SDKs
        run: |
          "$THEOS/bin/install-theos"

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"

          echo
          echo "=== Theos ==="
          ls -lah "$THEOS"

          echo
          echo "=== iPhone toolchain ==="
          ls -lah "$THEOS/toolchain/linux/iphone/bin"

          echo
          echo "=== clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo
          echo "=== SDKs ==="
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          SDK_COUNT=$(find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" | wc -l)

          if [ "$SDK_COUNT" -eq 0 ]; then
            echo "::error::No iOS SDKs were installed."
            exit 1
          fi

          echo
          echo "Found $SDK_COUNT iOS SDK(s)."

      - name: Show available SDK versions
        run: |
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -printf "%f\n" | sort -V

      - name: Build AppSync
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          echo "Generated packages:"
          ls -lah debs/

      - name: Verify Debian packages
        run: |
          shopt -s nullglob
          packages=(debs/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .deb packages were generated."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Checking: $package"
            dpkg-deb --info "$package"
          done

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppSync-${{ env.VERSION }}
          path: debs/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "AppSync Unified ${VERSION}" \
            --generate-notes \
            debs/*.deb
